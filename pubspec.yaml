name: varahiowner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  file_picker: ^11.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  shared_preferences: ^2.5.3
  location: ^8.0.1
  intl: ^0.20.2
  dio: ^5.9.2
  device_info_plus: ^12.4.0
  open_file: ^3.5.11
  google_mlkit_text_recognition: ^0.15.1
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ic_launcher.png

# ✅ OUTSIDE flutter (IMPORTANT)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  remove_alpha_ios: true