name: varahiowner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  file_picker: ^11.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ic_launcher.png

# ✅ OUTSIDE flutter (IMPORTANT)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  remove_alpha_ios: true